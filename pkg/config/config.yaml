server:
 env: "prod"
 service:

client:
  service:                                 # 命名服务端列表
    - name: gosume.UpdateService           # 服务端名，代码里按此名引用
      proto: http                          # 客户端协议：http（默认）；后续可扩展 redis/mysql/kafka 等
      target: https://raw.githubusercontent.com/muyu0211/Gosume/refs/heads/master   # 服务端 HTTP 地址（更新检查的相对路径以此为前缀，实际请求为 {target}/appcast.json）
      timeout_sec: 0                       # 显式 0：不设整体超时（更新包下载为长请求，超时由调用方 context 控制）
      proxy: ""                            # 该服务代理地址（留空则不设）
    # - name: gosume.TelemetryService
    #   target: https://api.example.com
    #   retry_count: 3                       # 覆盖客户端级默认（仅对 GET/HEAD 等幂等请求生效）

 
app:
  name: Gosume
  version: 0.9.0
  description: 桌面级简历制作工具
  copyright: "© 2026, Muyu"
  identifier: com.muyu.gosume

# 主窗口配置
window:
  title: Gosume
  width: 1280              # 初始宽度（像素）
  height: 800              # 初始高度（像素）
  min_width: 960           # 最小宽度（像素）
  min_height: 600          # 最小高度（像素）
  frameless: true          # 是否使用无边框窗口

# 日志配置
log:
  level: debug              # debug | info | warn | error
  max_size_mb: 10          # 单个日志文件最大体积（MB），超出后轮转
  max_backups: 5           # 保留的历史日志文件数量
  max_age_days: 30         # 历史日志最大保留天数
